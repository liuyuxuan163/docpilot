name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ★ 刻意不装任何运行时依赖：
      #   本项目核心零第三方依赖，所以这一步本身就是一条验证 ——
      #   如果哪天不小心引入了必装依赖，这里会直接失败。
      #   （不装 PyYAML 也顺带覆盖了内置 mini-YAML 的代码路径。）

      - name: 环境自检（验证零依赖可运行）
        run: python -m docpilot info

      - name: 单元测试
        run: python -m pytest tests -q -p no:cacheprovider

      - name: 拒答阈值标定检查（零误拒是硬约束）
        run: python scripts/calibrate_thresholds.py

      - name: 端到端评测 + 质量门禁
        run: python -m docpilot eval --report evals/reports/ci.md

      - name: 规模统计
        run: python scripts/count_lines.py

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: evals/reports/
          if-no-files-found: ignore
